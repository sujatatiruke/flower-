<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flower Garden</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: linear-gradient(pink, lightcoral);
      padding: 20px;
      color: white;
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px;
    }

    .card {
      background: white;
      width: 250px;
      margin: 15px;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    .card img {
      width: 100%;
      height: 180px;
      border-radius: 10px;
    }

    footer {
      background: #333;
      color: white;
      padding: 10px;
      margin-top: 20px;
    }
  </style>

</head>

<body>

  <header>
    <h1>🌸 Beautiful Flower Garden 🌸</h1>
    <p>Welcome to colorful flowers</p>
  </header>

  <div class="container">

    <div class="card">
      <img src="rose1.jpeg" alt="Rose">
      <h2>Rose</h2>
      <p>Symbol of love and beauty.</p>
    </div>

    <div class="card">
      <img src="sunflower.jpg" alt="Sunflower">
      <h2>Sunflower</h2>
      <p>Always turns toward the sun.</p>
    </div>

    <div class="card">
      <img src="lotus.jpg" alt="Lotus">
      <h2>Lotus</h2>
      <p>Sacred and pure flower.</p>
    </div>

  </div>

  <footer>
    <p>© 2026 Flower Garden Website</p>
  </footer>

</body>
</html>
